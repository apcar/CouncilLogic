[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "model-council"
version = "0.3.1a2"
description = "A local-first, auditable council of heterogeneous language models."
readme = "README.md"
requires-python = ">=3.11"
license = "AGPL-3.0-only"
authors = [{ name = "Andrew Greene" }]
dependencies = []

[project.scripts]
council = "model_council.cli:main"
council-remote = "model_council.remote:main"
council-service = "model_council.service:main"
council-mcp = "model_council.mcp_server:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
# Correctness-focused gate: pyflakes, pycodestyle errors, bugbear, and
# import hygiene. Style-only families are intentionally left out.
select = ["E4", "E7", "E9", "F", "B", "W6"]

[tool.mypy]
python_version = "3.11"
files = ["src/model_council"]
warn_unused_ignores = true
warn_redundant_casts = true
no_implicit_optional = true
check_untyped_defs = true
