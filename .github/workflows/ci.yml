name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Ubuntu / Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.14"]
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run 97-test suite
        run: PYTHONPATH=src python -m unittest discover -s tests -v
      - name: Compile source
        run: python -m compileall -q src tests scripts

  posix-lock:
    name: macOS / Python 3.14 POSIX lock
    runs-on: macos-latest
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.14"
      - name: Run full suite including POSIX lock coverage
        run: PYTHONPATH=src python -m unittest discover -s tests -v
      - name: Compile source
        run: python -m compileall -q src tests scripts

  package:
    name: Build, install, and mock smoke
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.14"
      - name: Build wheel and source distribution
        run: |
          python -m pip install --disable-pip-version-check build
          python -m build
      - name: Install wheel in a clean environment
        run: |
          python -m venv /tmp/model-council-wheel
          /tmp/model-council-wheel/bin/python -m pip install --disable-pip-version-check dist/*.whl
      - name: Credential-free mock smoke test
        run: |
          /tmp/model-council-wheel/bin/council --mock --data-dir /tmp/model-council-smoke doctor
          /tmp/model-council-wheel/bin/council --mock --data-dir /tmp/model-council-smoke run \
            --question "CI credential-free mock smoke test" --json
