name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    name: Lint (ruff) and type-check (mypy)
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"
      - name: Install pinned lint tools (CI only; no runtime dependencies)
        run: python -m pip install --disable-pip-version-check "ruff==0.17.1" "mypy==2.4.0"
      - name: Ruff
        run: ruff check .
      - name: Mypy
        run: mypy

  test:
    name: Ubuntu / Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.14"]
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run test suite
        run: PYTHONPATH=src python -m unittest discover -s tests -v
      - name: Compile source
        run: python -m compileall -q src tests scripts

  posix-lock:
    name: macOS / Python 3.14 POSIX lock
    runs-on: macos-latest
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"
      - name: Run full suite including POSIX lock coverage
        run: PYTHONPATH=src python -m unittest discover -s tests -v
      - name: Compile source
        run: python -m compileall -q src tests scripts

  package:
    name: Build, install, and mock smoke
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"
      - name: Build wheel and source distribution
        run: |
          python -m pip install --disable-pip-version-check build
          python -m build
      - name: Test the packaged source distribution
        run: |
          mkdir /tmp/model-council-sdist
          tar -xzf dist/*.tar.gz --strip-components=1 -C /tmp/model-council-sdist
          cd /tmp/model-council-sdist
          PYTHONPATH=src python -m unittest discover -s tests -v
      - name: Install wheel in a clean environment
        run: |
          python -m venv /tmp/model-council-wheel
          /tmp/model-council-wheel/bin/python -m pip install --disable-pip-version-check dist/*.whl
          /tmp/model-council-wheel/bin/python -c 'from importlib.metadata import version; import model_council; assert version("model-council") == model_council.__version__'
          /tmp/model-council-wheel/bin/council --version
      - name: Credential-free mock smoke test
        run: |
          /tmp/model-council-wheel/bin/council --mock --data-dir /tmp/model-council-smoke doctor
          /tmp/model-council-wheel/bin/council --mock --data-dir /tmp/model-council-smoke run \
            --question "CI credential-free mock smoke test" --json
