name: Bug report
description: Report a reproducible defect without sensitive data
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Do not include credentials, private prompts, provider responses, or
        exploit details. Use private vulnerability reporting for security issues.
  - type: input
    id: version
    attributes:
      label: Version or commit
      placeholder: 0.3.0a1
    validations:
      required: true
  - type: dropdown
    id: mode
    attributes:
      label: Surface
      options:
        - Mock CLI
        - Live CLI
        - Mock-only loopback service
        - Packaging or documentation
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Reproduction
      description: Minimal steps using synthetic, non-sensitive input.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      placeholder: "macOS 15, Python 3.14"
    validations:
      required: true
  - type: checkboxes
    id: terms
    attributes:
      label: Contribution gate
      options:
        - label: I have not included secrets or sensitive data.
          required: true
        - label: I understand that unsolicited pull requests and copyrightable contributions are closed.
          required: true
